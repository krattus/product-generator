<!DOCTYPE html>
<html lang="et">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>WooCommerce Tootegeneraator</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container">
    <header>
      <h1>WooCommerce Tootegeneraator</h1>
      <p class="subtitle">Loo tootekirjeldusi tehisintellekti abil</p>
    </header>

    <main>
      <div class="main-content">
        <!-- Input Section -->
        <section class="input-section">
          <div class="card">
            <h2>Sisesta tooted</h2>
            <p class="hint">Sisesta tootenimed, iga toode eraldi reale</p>
            <textarea id="products-input" placeholder="iPhone 15 Pro
Samsung Galaxy S24
Sony WH-1000XM5
DJI Mini 4 Pro"></textarea>

            <div class="language-selector">
              <label for="language-select">Väljundi keel:</label>
              <select id="language-select">
                <option value="et" selected>Eesti</option>
                <option value="en">Inglise</option>
                <option value="ru">Vene</option>
              </select>
            </div>

            <div class="input-actions">
              <span id="product-count">0 toodet</span>
              <button id="generate-btn" class="btn btn-primary">Genereeri tooted</button>
            </div>
          </div>
        </section>

        <!-- Progress Section (hidden by default) -->
        <section id="progress-section" class="progress-section hidden">
          <div class="card">
            <h2>Töötlemine</h2>
            <div class="progress-bar-container">
              <div id="progress-bar" class="progress-bar" style="width: 0%"></div>
            </div>
            <p id="progress-text" class="progress-text">0% (0/0)</p>

            <div id="product-list" class="product-list">
              <!-- Products will be added here dynamically -->
            </div>

            <div id="log-container" class="log-container">
              <h3>Tegevuste logi</h3>
              <div id="log-output" class="log-output"></div>
            </div>
          </div>
        </section>

        <!-- Results Section (hidden by default) -->
        <section id="results-section" class="results-section hidden">
          <div class="card">
            <h2>Tulemused</h2>
            <div id="summary" class="summary">
              <!-- Summary will be added here dynamically -->
            </div>
            <div class="download-actions">
              <button id="download-csv" class="btn btn-success">Laadi alla CSV</button>
              <button id="download-report" class="btn btn-secondary">Laadi alla raport</button>
            </div>
          </div>
        </section>
      </div>

      <!-- Sidebar -->
      <aside class="sidebar">
        <div class="card">
          <h2>Viimased tööd</h2>
          <div id="jobs-list" class="jobs-list">
            <p class="no-jobs">Viimased tööd puuduvad</p>
          </div>
        </div>
      </aside>
    </main>

    <footer>
      <p>Põhineb OpenAI GPT-4 tehnoloogial</p>
    </footer>
  </div>

  <script src="app.js"></script>
</body>
</html>
